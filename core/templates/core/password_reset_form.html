{% extends 'core/base.html' %}
{% block title %}Reset Password - Deploynix{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-24 px-4">
    <h1 class="text-3xl font-bold mb-2 text-center">Forgot Password?</h1>
    <p class="text-gray-500 text-center mb-8">Enter your email and we'll send you a reset link.</p>

    <form method="post" class="bg-white border-2 border-gray-400 rounded-lg p-8 shadow-sm">
        {% csrf_token %}
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Email</label>
            {{ form.email }}
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded font-semibold">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
