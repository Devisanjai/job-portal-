{% extends 'core/base.html' %}
{% block title %}Verify Admin Login - Deploynix{% endblock %}
{% block content %}

<div class="max-w-md mx-auto my-24 px-4">
    <p class="text-xs font-bold tracking-widest text-red-600 mb-1 text-center">DEPLOYNIX ADMIN PORTAL</p>
    <h1 class="text-3xl font-bold mb-2 text-center">Verify Your Login</h1>
    <p class="text-gray-500 text-center mb-8">Enter the verification code sent to your email.</p>

    {% if error %}
    <div class="bg-red-50 text-red-600 border border-red-200 text-sm p-3 rounded mb-4">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" class="bg-white border-2 border-gray-400 rounded-lg p-8 shadow-sm">
        {% csrf_token %}
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Six-digit verification code</label>
            <input type="text" name="otp_code" maxlength="6" inputmode="numeric" pattern="[0-9]*"
                   class="w-full border rounded px-3 py-2 text-center text-2xl tracking-widest"
                   autofocus required>
        </div>

        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded font-semibold">
            Verify
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        <a href="{% url 'admin_login' %}" class="text-red-600 hover:underline">Back to login</a>
    </p>
</div>

{% endblock %}
