{% extends 'core/base.html' %}
{% block title %}Verifier Login - Deploynix{% endblock %}
{% block content %}

<div class="max-w-md mx-auto my-24 px-4">
    <p class="text-xs font-bold tracking-widest text-red-600 mb-1 text-center">DEPLOYNIX ADMIN PORTAL</p>
    <h1 class="text-3xl font-bold mb-2 text-center">Verifier Sign In</h1>
    <p class="text-gray-500 text-center mb-8">Access for background verification staff only.</p>

    {% if error %}
    <div class="bg-red-50 text-red-600 border border-red-200 text-sm p-3 rounded mb-4">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" class="bg-white border-2 border-gray-400 rounded-lg p-8 shadow-sm">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Username</label>
            <input type="text" name="username" class="w-full border rounded px-3 py-2" required autofocus>
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password" class="w-full border rounded px-3 py-2" required>
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded font-semibold">
            Sign In
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        <a href="{% url 'admin_login' %}" class="text-red-600 hover:underline">Back to Admin Login</a>
    </p>
</div>

{% endblock %}
